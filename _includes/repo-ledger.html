<div class="tgf-ledger-wrap">
  <div class="tgf-section-head">
    <span class="tgf-meta" id="tgf-repo-count">carregando…</span>
  </div>
  <div class="tgf-ledger" id="tgf-repo-list">
    <div class="tgf-empty">Buscando repositórios…</div>
  </div>
</div>

<script>
/*
  Como funciona:
  1. Busca todos os repositórios PÚBLICOS de TGF231 via API do GitHub.
  2. Filtra os que têm "has_pages: true" — ou seja, já publicaram uma GitHub Page.
  3. Monta o link da page como https://TGF231.github.io/<nome-do-repo>/

  Repositório público novo com Pages ativado aparece aqui sozinho.

  Limitação real do GitHub: a API pública não expõe repositórios PRIVADOS
  para quem não está autenticado. Uma Page publicada a partir de um repo
  privado (ex: Backup_Maximus) precisa ser adicionada manualmente no
  array MANUAL_ENTRIES abaixo — colocar um token de acesso neste HTML
  público exporia sua conta, então isso não é feito automaticamente.
*/

const TGF_USERNAME = "TGF231";

const TGF_MANUAL_ENTRIES = [
  {
    name: "Backup_Maximus",
    description: "Rotina de backup do Maximus — página de status/documentação.",
    language: "Python",
    pageUrl: `https://${TGF_USERNAME}.github.io/Backup_Maximus/`,
    private: true
  }
];

// Repositórios que não devem aparecer mesmo tendo Pages ativado
// (ex: o próprio repositório deste site).
const TGF_EXCLUDE = ["TGF231.github.io", "Home-Page"];

async function tgfLoadRepos() {
  const listEl = document.getElementById("tgf-repo-list");
  const countEl = document.getElementById("tgf-repo-count");

  let autoEntries = [];
  try {
    const res = await fetch(`https://api.github.com/users/${TGF_USERNAME}/repos?per_page=100`);
    if (!res.ok) throw new Error("API respondeu " + res.status);
    const repos = await res.json();

    autoEntries = repos
      .filter(r => r.has_pages && !TGF_EXCLUDE.includes(r.name))
      .map(r => ({
        name: r.name,
        description: r.description || "Sem descrição.",
        language: r.language || "—",
        pageUrl: `https://${TGF_USERNAME}.github.io/${r.name}/`,
        private: false
      }));
  } catch (err) {
    listEl.innerHTML = `<div class="tgf-error">Não foi possível carregar via API agora (${err.message}). Mostrando apenas entradas manuais.</div>`;
  }

  const manual = TGF_MANUAL_ENTRIES.filter(m => !TGF_EXCLUDE.includes(m.name));
  const seen = new Set(autoEntries.map(e => e.name));
  const all = [...autoEntries, ...manual.filter(m => !seen.has(m.name))];

  countEl.textContent = `${all.length} ${all.length === 1 ? "página" : "páginas"}`;

  if (all.length === 0) {
    listEl.innerHTML = `<div class="tgf-empty">Nenhuma page publicada encontrada ainda.</div>`;
    return;
  }

  listEl.innerHTML = all.map(entry => `
    <div class="tgf-row">
      <div class="tgf-name"><a href="${entry.pageUrl}" target="_blank" rel="noopener">${entry.name}</a></div>
      <div class="tgf-lang">${entry.language}</div>
      <div class="tgf-status ${entry.private ? "tgf-private" : "tgf-live"}">${entry.private ? "manual" : "live"}</div>
      <div class="tgf-desc">${entry.description}</div>
    </div>
  `).join("");
}

tgfLoadRepos();
</script>
