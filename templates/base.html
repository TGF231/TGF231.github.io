<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/assets/img/avatar.png">
<!-- Tema salvo (claro ou escuro) antes de pintar, para a página não piscar ao abrir. -->
<script>try { var t = localStorage.getItem("tema"); if (t === "claro" || t === "escuro") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body class="{{classeCorpo}}">
<a class="pular" href="#main">Pular para o conteúdo</a>

<!-- Fundo em malha: manchas de cor desfocadas atrás do vidro. -->
<div class="fundo" aria-hidden="true"><span class="mancha mancha--1"></span><span class="mancha mancha--2"></span><span class="mancha mancha--3"></span></div>

<header class="topo">
  <div class="topo__lado">
    <a class="pilula topo__inicio" href="/"><span class="ponto-vivo" aria-hidden="true"></span>Início</a>
  </div>
  <a class="marca" href="/">{{brand}}<span class="ponto">.</span></a>
  <div class="topo__lado topo__lado--dir">
    {{marca}}
    {{menu}}
    <button type="button" class="pilula pilula--icone" id="tema" aria-label="Trocar entre tema claro e escuro" title="Tema claro ou escuro">
      <span class="tema__sol">{{iconeSol}}</span><span class="tema__lua">{{iconeLua}}</span>
    </button>
    <a class="pilula pilula--entrar" href="{{centralUrl}}" rel="nofollow">{{iconeEntrar}}<span>{{centralRotulo}}</span></a>
  </div>
</header>

<main id="main" tabindex="-1">
{{body}}
</main>
{{acao}}

<footer class="rodape">
  <span><span class="ponto-vivo" aria-hidden="true"></span>{{rodapeEstado}}</span>
  <span class="mono">{{rodapeContagem}}</span>
  <span>{{year}} · {{brand}}</span>
</footer>

<script src="/assets/js/app.js" defer></script>
</body>
</html>
