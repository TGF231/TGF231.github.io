<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<link rel="icon" href="/assets/img/avatar.png">
<link rel="stylesheet" href="/assets/megui/megui.css">
<link rel="stylesheet" href="/assets/megui/megui-componentes.css">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<a class="pular" href="#main">Pular para o conteúdo</a>

<div class="mg-janela mg-janela--tela" id="janela">
  <header class="mg-barra-titulo">
    <a class="mg-barra-titulo__app" href="/">{{brand}}</a>
    <span class="mg-barra-titulo__contexto" id="contexto">{{contexto}}</span>
    {{marca}}
    <div class="mg-espaco"></div>
    {{menu}}
    <a class="mg-botao mg-botao--compacta entrar" href="{{centralUrl}}" rel="nofollow">{{iconeEntrar}}<span>{{centralRotulo}}</span></a>
  </header>

  <div class="mg-janela__conteudo">
    <main id="main" class="{{rolavel}}" tabindex="-1">
{{body}}
    </main>
    {{acao}}
  </div>

  <footer class="mg-rodape">
    <span class="mg-rodape__estado"><span class="mg-rodape__ponto mg-rodape__ponto--ok" aria-hidden="true"></span>{{rodapeEstado}}</span>
    <span class="mg-rodape__contagem">{{rodapeContagem}}</span>
    <div class="mg-espaco"></div>
    <span class="mg-rodape__versao">{{year}} · {{brand}}</span>
  </footer>
</div>

<script src="/assets/megui/megui.js" defer></script>
<script src="/assets/js/app.js" defer></script>
</body>
</html>
